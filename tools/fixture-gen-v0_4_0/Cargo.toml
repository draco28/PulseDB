# Fixture generator for the REAL published pulsehive-db =0.4.0 (schema-v2) store.
#
# ISOLATION (audit C9): this crate lives OUTSIDE the production cargo workspace.
# The empty [workspace] table below makes THIS Cargo.toml its own workspace root,
# so cargo never walks up into the production root manifest — the production root
# Cargo.toml is a single [package] with NO [workspace]/exclude and stays that way.
# Build only via an explicit `--manifest-path` (see README) so it never joins the
# production build/test graph.
[package]
name = "fixture-gen-v0_4_0"
version = "0.0.0"
edition = "2021"
publish = false

# Own workspace root — do NOT remove (isolation from the production crate).
[workspace]

[dependencies]
# Pinned EXACTLY to the published prior release (schema-v2). Default features
# only (no ONNX/ort); embeddings injected as raw f32 via the External provider.
pulsehive-db = "=0.4.0"
serde_json = "1"
# Same redb major/minor the published crate resolves transitively (2.6.x) — used
# to re-open the frozen store read-only and dump GENUINE on-disk copy-through
# raw bytes as manifest ground truth (audit C4).
redb = "2.6"
