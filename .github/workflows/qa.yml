name: QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read
  pull-requests: write

jobs:
  qa:
    name: Functional QA (consumer simulation)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: qa

      - name: Install droid CLI
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Cache ONNX model (for builtin-embeddings tests)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pulsedb/models/all-MiniLM-L6-v2
          key: minilm-model-v1

      - name: Run functional QA
        id: qa
        continue-on-error: true
        timeout-minutes: 18
        env:
          CI: true
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          mkdir -p qa-results
          droid exec --auto high "You are running in a non-interactive CI environment. There is NO human available. Do NOT use AskUser, do NOT wait for confirmations, do NOT pause for input. Run the qa skill (.factory/skills/qa/SKILL.md). Analyze the git diff (origin/main...HEAD). Write consumer-simulation Rust test programs that exercise the changed public API areas. Compile and run them with cargo test across the relevant feature configurations. Write the final report to qa-results/report.md. Clean up any tests/qa_flow_*.rs files you created." 2>&1 | tee qa-results/qa-output.txt || true

      - name: Post QA report as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT=""
          if [ -f qa-results/report.md ]; then
            REPORT=$(cat qa-results/report.md)
          elif [ -f qa-results/qa-output.txt ]; then
            REPORT="<details><summary>QA raw output</summary>

          \`\`\`
          $(tail -50 qa-results/qa-output.txt)
          \`\`\`
          </details>"
          fi

          # Ensure report starts with ## QA Report
          if ! echo "$REPORT" | head -1 | grep -q "## QA Report"; then
            REPORT="## QA Report

          $REPORT"
          fi

          # Footer
          FOOTER="
          ---

          <sub>QA workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</sub>"

          BODY="<!-- qa-report -->
          ${REPORT}${FOOTER}"

          # Search for existing QA comment
          PR_NUMBER=${{ github.event.pull_request.number || 0 }}
          if [ "$PR_NUMBER" -gt 0 ]; then
            EXISTING=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[] | select(.body | startswith("<!-- qa-report -->")) | .id' | head -1)
            if [ -n "$EXISTING" ]; then
              # Update existing comment
              gh pr comment "$PR_NUMBER" --edit "$EXISTING" --body "$BODY"
            else
              # Create new comment
              gh pr comment "$PR_NUMBER" --body "$BODY"
            fi
          else
            echo "Not a PR — skipping comment post"
          fi

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: qa-results/
          retention-days: 14
