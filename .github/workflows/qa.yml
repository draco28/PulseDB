name: QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read
  pull-requests: write

jobs:
  qa:
    name: Functional QA (consumer simulation)
    # SECURITY: only run on the self-hosted runner for trusted actors (repo owner).
    # Self-hosted runners have NO sandbox — untrusted PRs must not execute here.
    # For non-trusted-actor PRs, the job is skipped (does not block merge).
    if: github.actor == 'draco28'
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify droid + rust available
        run: |
          echo "=== droid ===" && droid --version
          echo "=== rust ===" && rustc --version
          echo "=== cargo ===" && cargo --version

      - name: Install QA skills into checkout
        run: |
          # The QA skills live in the AI workspace repo, not canonical.
          # Copy them into the checkout so droid discovers them at project-level
          # (.factory/skills/). This avoids global skill collisions across projects.
          git clone --depth 1 https://github.com/pulseai-labs/pulsedb-internal /tmp/ai-workspace 2>/dev/null || \
            git clone --depth 1 git@github.com:pulseai-labs/pulsedb-internal.git /tmp/ai-workspace
          if [ -d /tmp/ai-workspace/.factory/skills/qa ]; then
            mkdir -p .factory/skills
            cp -R /tmp/ai-workspace/.factory/skills/qa .factory/skills/qa
            cp -R /tmp/ai-workspace/.factory/skills/qa-library .factory/skills/qa-library
            echo "QA skills installed into checkout"
            ls .factory/skills/qa/SKILL.md .factory/skills/qa-library/SKILL.md
          else
            echo "WARNING: QA skills not found in AI workspace clone"
          fi
          rm -rf /tmp/ai-workspace

      - name: Cache ONNX model (for builtin-embeddings tests)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/pulsedb/models/all-MiniLM-L6-v2
          key: minilm-model-v1

      - name: Run functional QA
        id: qa
        continue-on-error: true
        timeout-minutes: 18
        env:
          CI: true
        run: |
          mkdir -p qa-results
          droid exec --auto high -m "custom:GLM-[Z.AI-Coding-Plan]---Openai-0" "You are running in a non-interactive CI environment. There is NO human available. Do NOT use AskUser, do NOT wait for confirmations, do NOT pause for input. Run the qa skill (it's at .factory/skills/qa/SKILL.md in the current checkout). Read .factory/skills/qa/config.yaml for feature configurations. Read .factory/skills/qa-library/SKILL.md for the test flow menu. Analyze the git diff (origin/main...HEAD). Write consumer-simulation Rust test programs that exercise the changed public API areas. Compile and run them with cargo test across the relevant feature configurations. Write the final report to qa-results/report.md. Clean up any tests/qa_flow_*.rs files you created." 2>&1 | tee qa-results/qa-output.txt || true

      - name: Post QA report as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT=""
          if [ -f qa-results/report.md ]; then
            REPORT=$(cat qa-results/report.md)
          elif [ -f qa-results/qa-output.txt ]; then
            REPORT="<details><summary>QA raw output</summary>

          $(tail -50 qa-results/qa-output.txt)

          </details>"
          fi

          # Ensure report starts with ## QA Report
          if ! echo "$REPORT" | head -1 | grep -q "## QA Report"; then
            REPORT="## QA Report

          $REPORT"
          fi

          # Footer
          FOOTER="
          ---

          <sub>QA workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</sub>"

          BODY="<!-- qa-report -->
          ${REPORT}${FOOTER}"

          # Search for existing QA comment
          PR_NUMBER=${{ github.event.pull_request.number || 0 }}
          if [ "$PR_NUMBER" -gt 0 ]; then
            EXISTING=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[] | select(.body | startswith("<!-- qa-report -->")) | .id' | head -1)
            if [ -n "$EXISTING" ]; then
              gh pr comment "$PR_NUMBER" --edit "$EXISTING" --body "$BODY"
            else
              gh pr comment "$PR_NUMBER" --body "$BODY"
            fi
          else
            echo "Not a PR — skipping comment post"
          fi

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: qa-results/
          retention-days: 14
